# --- Gedeeld door pagina's ---
termsofservice.error.csrf=Er is een CSRF-fout opgetreden. Probeer het opnieuw.
termsofservice.info.sasl2Only=<p>Belangrijk: alleen SASL2 Task-gebaseerde handhaving</p><p>Deze plugin vereist dat gebruikers de Servicevoorwaarden accepteren met behulp van het SASL2-mechanisme "Task" tijdens de authenticatie. In de huidige versie van deze plugin is dit <em>alleen van toepassing op clients die authenticeren met SASL2 en Tasks ondersteunen</em>.</p><p>Clients die verbinding maken met oudere authenticatiemethoden (zoals legacy SASL, Non-SASL Authentication / Jabber Iq Auth, of een andere verbindingsmethode die niet gebaseerd is op SASL2 Tasks) omzeilen deze controle op de Servicevoorwaarden volledig. Zij kunnen zich normaal authenticeren zonder ooit te worden gevraagd de voorwaarden te accepteren.</p><p>Als je server deze oudere of alternatieve verbindingsmethoden toestaat, hoeven gebruikers van de betreffende clients niet akkoord te gaan met je Servicevoorwaarden. Om een consistente handhaving te garanderen, kun je overwegen om niet-SASL2-authenticatiemechanismen op deze server te beperken of uit te schakelen, of deze beperking duidelijk in je eigen beleid te vermelden.</p>
termsofservice.warning.noCurrentDocument=De functie Servicevoorwaarden is ingeschakeld, maar er is geen tekst van de Servicevoorwaarden als actief gemarkeerd. Alle clients die de functionaliteit ondersteunen, kunnen zich niet aanmelden totdat je een tekst van de Servicevoorwaarden activeert of de functionaliteit uitschakelt.
termsofservice.nav.backToVersions=\u00ab Terug naar alle versies
