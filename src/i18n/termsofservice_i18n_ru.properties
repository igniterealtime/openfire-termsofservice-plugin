termsofservice.error.csrf=A CSRF failure occurred. Please try again.
termsofservice.info.sasl2Only=<p> Важно: Принудительное принятие условий через механизм задач SASL2</p> <p>Этот плагин требует, чтобы пользователи принимали Условия использования с помощью механизма «задач» (Task) протокола SASL2 в процессе аутентификации. В текущей версии плагина это <em>требование распространяется только на клиентов, использующих аутентификацию SASL2 и поддерживающих механизм задач</em>. </p><p>Клиенты, подключающиеся с использованием устаревших методов аутентификации (например, классического SASL, аутентификации без SASL / Jabber Iq Auth или любых других методов, не использующих задачи SASL2), полностью минуют эту проверку Условий использования. Они смогут пройти аутентификацию в обычном режиме, и им не будет предложено принять условия.</p> <p>Если ваш сервер допускает использование таких устаревших или альтернативных методов подключения, от пользователей соответствующих клиентов не потребуется соглашаться с вашими Условиями использования. Для обеспечения единообразного применения правил рассмотрите возможность ограничения или отключения на сервере механизмов аутентификации, отличных от SASL2, либо четко укажите это ограничение в своих правилах использования.</p>
termsofservice.warning.noCurrentDocument=Функциональность «Условия использования» включена, но ни один текст условий не отмечен как активный. Клиенты, поддерживающие эту функцию, не смогут войти в систему, пока вы не активируете текст условий или не отключите саму функцию.
