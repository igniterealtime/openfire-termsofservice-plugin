# --- Shared across pages ---
termsofservice.error.csrf=A CSRF failure occurred. Please try again.
termsofservice.info.sasl2Only=<p>Important: SASL2 Task-based enforcement only</p><p>This plugin requires users to accept the Terms of Service using the SASL2 "Task" mechanism during authentication. In the current version of this plugin, this <em>only applies to clients that authenticate using SASL2 and support Tasks</em>.</p><p>Clients that connect using older authentication methods (such as legacy SASL, Non-SASL Authentication / Jabber Iq Auth, or any other connectivity method not based on SASL2 Tasks) will bypass this Terms of Service check entirely. They will be able to authenticate normally without ever being prompted to accept the terms.</p><p>If your server allows these older or alternative connection methods, users on affected clients will not be required to agree to your Terms of Service. To ensure consistent enforcement, consider restricting or disabling non-SASL2 authentication mechanisms on this server, or clearly communicate this limitation in your own policies.</p>
termsofservice.warning.noCurrentDocument=The Terms of Service feature is enabled, but no Terms of Service text is marked as active. All clients supporting the functionality will be unable to log in until you either activate a Terms of Service text or disable the functionality.
